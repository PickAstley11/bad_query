name: Build bad_query Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name "Xcode_27*.app" | head -n 1)

          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 27 was not found."
            echo "Installed Xcode versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version

      - name: Show project information
        run: |
          xcodebuild \
            -list \
            -project "$PWD/bad_query.xcodeproj"

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project "$PWD/bad_query.xcodeproj" \
            -scheme "bad_query" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/bad_query.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p build/Payload

          cp -R \
            build/bad_query.xcarchive/Products/Applications/*.app \
            build/Payload/

          cd build
          zip -r bad_query-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query-unsigned-IPA
          path: build/bad_query-unsigned.ipa
